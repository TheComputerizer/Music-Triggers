buildscript {
    repositories {
        gradlePluginPortal() {
            content {
                [ 'com.fasterxml.woodstox', 'com.fasterxml.jackson.core', 'com.fasterxml.jackson', 'com.fasterxml',
                  'com.google.code.findbugs', 'com.google.code.gson', 'com.google.errorprone', 'com.google.guava',
                  'com.google.j2objc', 'commons-io', 'io.fabric8', 'io.github.goooler.shadow', 'io.netty',
                  'jakarta.platform', 'me.jamiemansfield', 'org.apache', 'org.apache.ant', 'org.apache.commons',
                  'org.apache.logging', 'org.apache.logging.log4j', 'org.apache.maven', 'org.benf', 'org.cadixdev',
                  'org.checkerframework', 'org.codehaus.groovy', 'org.codehaus.plexus', 'org.codehaus.woodstox',
                  'org.eclipse.ee4j', 'org.eclipse.jdt', 'org.eclipse.jetty', 'org.eclipse.platform', 'org.jdom',
                  'org.jetbrains', 'org.jetbrains.kotlin', 'org.jetbrains.kotlinx', 'org.junit', 'org.mockito',
                  'org.ow2', 'org.ow2.asm', 'org.slf4j', 'org.sonatype.oss', 'org.springframework', 'org.vafer',
                  'org.zeroturnaround'].forEach { includeGroup it }
            }
        }
        maven {
            name = 'Fabric'
            url = uri 'https://maven.fabricmc.net/'
            content {
                [ 'fabric-loom', 'net.fabricmc', 'net.fabricmc.fabric-api' ].forEach { includeGroup it }
            }
        }
    }
    dependencies {
        classpath "$loom_plugin:$loom_version"
        classpath "$shadow_plugin:$shadow_version"
    }
}

apply from: rootProject.file('gradle\\java17-module.gradle')
apply from: rootProject.file('gradle\\fabric.gradle')
apply from: rootProject.file('gradle\\shadow-relocate.gradle')

plugins.apply 'fabric-loom'

def base = project ':api'
def fabric = project ':fabric'
def shared = project ':shared:shared_1.18'

def args = [
        '-Dfabric.log.level=debug',
        '-Dtil.dev=true',
        '-Dtil.classpath.mods=mods.thecomputerizer.theimpossiblelibrary.api.common.TILCommonEntryPoint;'+mod_entrypoint,
        '-Dtil.classpath.coremods=mods.thecomputerizer.musictriggers.api.core.MTCoreEntryPoint'
]

[ runClient, runServer ].forEach { it.jvmArgs args }

repositories {
    maven {
        name = 'CurseMaven'
        url = uri 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name 'Modrinth'
        url = uri 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'ModMaven'
        url = uri 'https://modmaven.dev'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

dependencies {
    minecraft "$fabric_mc:$minecraft_1_18_2"
    mappings loom.layered() {
        officialMojangMappings()
        parchment "$parchment_data-$minecraft_1_18_2:$parchment_1_18_2@zip"
    }

    compileOnlyApi base
    compileOnlyApi fabric
    compileOnlyApi shared

    modImplementation "$fabric_loader_artifact:$fabric_loader"
    modImplementation "$fabric_api_artifact:$fabric_1_18_2"
    modImplementation "$cloth_artifact:$cloth_1_18_2"
    modImplementation "$modmenu_artifact:$modmenu_1_18_2"
    modImplementation "mods.thecomputerizer.theimpossiblelibrary:theimpossiblelibrary:$til_version"

    modRuntimeOnly "$jei_artifact:$jei_fabric_1_18_2"
}

remapJar {
    setArchiveBaseName "${mod_id}_remapped"
    inputFile = tasks.shadowJar.archiveFile
}

processResources {
    from base.processResources.outputs
}

processTestResources {
    from base.processTestResources.outputs
}

compileJava {
    source fabric.sourceSets.main.allJava
}

compileTestJava {
    source fabric.sourceSets.test.allJava
}

jar {
    setArchiveBaseName mod_id
    from(fabric.jar.archiveFile.collect { zipTree it })
}

shadowJar {
    shared.afterEvaluate {
        from it.sourceSets.main.output.classesDirs.asFileTree
    }
}

tasks.assemble.dependsOn shadowJar
tasks.shadowJar.finalizedBy 'remapJar'
tasks.jar.finalizedBy 'shadowJar'
tasks.compileJava.mustRunAfter ':fabric:build'
tasks.compileJava.mustRunAfter ':shared:shared_1.18:build'