buildscript {
    repositories {
        gradlePluginPortal() {
            content {
                plugin_portal_content.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
        maven {
            name = 'Fabric'
            url = uri 'https://maven.fabricmc.net/'
            content {
                fabric_content.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
    }
    dependencies {
        classpath "$loom_plugin:$loom_version"
        classpath "$shadow_plugin:$shadow_version"
    }
}

apply from: rootProject.file('gradle\\java8-module.gradle')
apply from: rootProject.file('gradle\\fabric.gradle')
apply from: rootProject.file('gradle\\shadow-relocate.gradle')

plugins.apply 'fabric-loom'

def base = project ':api'
def fabric = project ':fabric'
def shared = project ':shared:shared_1.16'

def args = [
        '-Dfabric.log.level=debug',
        '-Dtil.dev=true',
        '-Dtil.classpath.mods=mods.thecomputerizer.theimpossiblelibrary.api.common.TILCommonEntryPoint;'+mod_entrypoint,
        '-Dtil.classpath.coremods=mods.thecomputerizer.musictriggers.api.core.MTCoreEntryPoint'
]

[ runClient, runServer ].forEach { it.jvmArgs args }

repositories {
    maven {
        name 'Modrinth'
        url = uri 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:$minecraft_1_16_5"
    mappings loom.layered() {
        officialMojangMappings()
        parchment "$parchment_data-$minecraft_1_16_5:$parchment_1_16_5@zip"
    }

    compileOnlyApi base
    compileOnlyApi fabric
    compileOnlyApi shared

    modImplementation "$fabric_loader_artifact:$fabric_loader"
    modImplementation "$fabric_api_artifact:$fabric_1_16_5"
    modImplementation "$cloth_artifact:$cloth_1_16_5"
    modImplementation "$modmenu_artifact:$modmenu_1_16_5"
    modImplementation "$til_artifact:$til_version"
}

remapJar {
    setArchiveBaseName "${mod_id}_remapped"
    inputFile = tasks.shadowJar.archiveFile
}

processResources {
    from base.processResources.outputs
}

processTestResources {
    from base.processTestResources.outputs
}

compileJava {
    source fabric.sourceSets.main.allJava
}

compileTestJava {
    source fabric.sourceSets.test.allJava
}

jar {
    setArchiveBaseName mod_id
    from(fabric.jar.archiveFile.collect { zipTree it })
}

shadowJar {
    shared.afterEvaluate {
        from it.sourceSets.main.output.classesDirs.asFileTree
    }
}

tasks.assemble.dependsOn shadowJar
tasks.shadowJar.finalizedBy remapJar
tasks.jar.finalizedBy shadowJar
tasks.compileJava.mustRunAfter ':fabric:build'
tasks.compileJava.mustRunAfter ':shared:shared_1.16:build'