pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = uri('https://maven.fabricmc.net/')
            content {
                [ 'fabric-loom', 'net.fabricmc', 'net.fabricmc.fabric-api' ].forEach { includeGroup it }
            }
        }
        maven {
            name = 'Forge'
            url = uri('https://maven.minecraftforge.net/')
            content {
                [ 'net.minecraftforge', 'net.minecraftforge.gradle',
                  'org.spongepowered' ].forEach{ includeGroup it }
            }
        }
        maven {
            name = 'Garden of Fancy'
            url = uri('https://maven.gofancy.wtf/releases')
            content {
                includeGroup 'wtf.gofancy.fancygradle'
            }
        }
        maven {
            name = 'ParchmentMC'
            url = uri('https://maven.parchmentmc.org')
            content {
                [ 'org.parchmentmc', 'org.parchmentmc.feather',
                  'org.parchmentmc.librarian.forgegradle' ].forEach { includeGroup it }
            }
        }
    }
    includeBuild("${default_directory}\\Multiversion-Project-Helper")
}

plugins {
    id 'multiversionhelper.settings'
}

rootProject.name = 'Music-Triggers'

multiversion {
    name = 'Music-Triggers'
    group = base_package
    default_classes = [ 'client', 'common' ]
    default_preprocessor = 'gradle\\\\\\\\lavaplayer'
    default_resource_output = 'run_client\\\\\\\\MTResources'
}

def paths = [                                ':api',     ':legacy:1.12',
  ':fabric:1.16',        ':forge:1.16',                                                        ':shared:1.16',
  ':fabric:1.18',        ':forge:1.18',                                                        ':shared:1.18',
  ':fabric:1.19',        ':forge:1.19',                                                        ':shared:1.19',
  ':fabric:1.20',        ':forge:1.20',                               ':neoforge:1.20',        ':shared:1.20',
  ':fabric:1.21',        ':forge:1.21',                               ':neoforge:1.21',        ':shared:1.21',
  ':fabric:1.19:1.19.2', ':forge:1.19:1.19.2',                                          ':shared:1.19:1.19.2',
  ':fabric:1.19:1.19.4', ':forge:1.19:1.19.4',                                          ':shared:1.19:1.19.4',
  ':fabric:1.20:1.20.1', ':forge:1.20:1.20.1',                 ':neoforge:1.20:1.20.1', ':shared:1.20:1.20.1',
  ':fabric:1.20:1.20.4', ':forge:1.20:1.20.4',                 ':neoforge:1.20:1.20.4', ':shared:1.20:1.20.4',
  ':fabric:1.20:1.20.6', ':forge:1.20:1.20.6',                 ':neoforge:1.20:1.20.6', ':shared:1.20:1.20.6',
  ':fabric:1.21:1.21.1', ':forge:1.21:1.21.1',                 ':neoforge:1.21:1.21.1', ':shared:1.21:1.21.1'
]

paths.forEach {
    include it
}

paths.forEach {
    String[] split = (it.startsWith(':') ? it.substring(1) : it).split(':')
    String name = split.first()
    if(split.length>1) {
        String last = split.last()
        if(name=='api' || name=='legacy') name = last
        else name = name+"_"+last
    }
    findProject(it)?.name = name
}